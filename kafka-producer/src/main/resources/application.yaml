spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}  # ← Spring manages this
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      buffer-memory: 33554432
      compression-type: snappy
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true

kafka:
  topic:                                                           # ← your custom properties
    name: ${KAFKA_TOPIC_NAME:user-events}
    dlt-suffix: .DLT

logging:
  level:
    dev.perfectbogus.kafkaproducer: DEBUG
    org.apache.kafka: WARN
