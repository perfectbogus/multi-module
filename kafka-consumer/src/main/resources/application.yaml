spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:my-consumer-group}
      auto-offset-reset: earliest       # start from beginning if no offset exists
      enable-auto-commit: false         # manual commit for reliability
      max-poll-records: 10              # process 10 records per poll
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "dev.perfectbogus.api.event"
        spring.json.use.type.headers: false
    listener:
      ack-mode: MANUAL_IMMEDIATE        # commit offset only after successful processing
      concurrency: 3

kafka:
  topic:
    name: ${KAFKA_TOPIC_NAME:user-events}
    dlt-suffix: .DLT

logging:
  level:
    dev.perfectbogus.kafkaconsumer: DEBUG
    org.apache.kafka: WARN
