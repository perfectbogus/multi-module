spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:employeedb}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:""}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false    # ← disable in docker!

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always