# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Job 1: Test employee-api ─────────────────────────────
  test-employee-api:
    name: Test Employee API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Cache scoped to employee-api/pom.xml!
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-employee-api-${{ hashFiles('employee-api/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-employee-api-

      - name: Make mvnw executable
        run: chmod +x employee-api/mvnw

      - name: Run tests
        working-directory: employee-api   # ← run FROM employee-api folder!
        run: ./mvnw test

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'employee-api/target/surefire-reports/*.xml'

  build-employee-api:
    name: Build Employee API Docker Image
    runs-on: ubuntu-latest
    needs: test-employee-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-employee-api-${{ hashFiles('employee-api/pom.xml') }}

      - name: Make mvnw executable
        run: chmod +x employee-api/mvnw

      - name: Build JAR
        working-directory: employee-api
        run: ./mvnw package -DskipTests

      - name: Build Docker Image
        working-directory: employee-api
        run: |
          docker build -t employee-api:${{ github.sha }} -t employee-api:latest .

      - name: Verify container starts
        run: |
          docker run -d --name test-container -p 8080:8080 -e SPRING_PROFILES_ACTIVE=docker employee-api:${{ github.sha }}
          sleep 15
          curl --fail http://localhost:8080/actuator/health || (docker logs test-container && exit 1)
          docker stop test-container
          
